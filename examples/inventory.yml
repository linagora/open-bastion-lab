all:
  vars:
    ansible_user: maintainer
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ob_apt_sources_list_line: "deb [trusted=yes] http://192.168.122.1:8000 ./"

  children:
    bastions:
      vars:
        ob_role: bastion
        ob_server_group: bastion
        ob_client_id: pam-bastion
        ob_client_secret: pamsecret
        ob_sso_jwks_fetch: true
      hosts:
        bastion-1:
          ansible_host: 192.168.122.2

    backends:
      vars:
        ob_role: backend
        ob_server_group: backend
        ob_client_id: pam-access
        ob_client_secret: pamsecret
      hosts:
        backend-1:
          ansible_host: 192.168.122.66
        backend-2:
          ansible_host: 192.168.122.67
