# ob-builder configuration, replayed without any question by:
#   ob-builder --config ob-builder-max-security.yml --output-ansible ansible/
# Generated by ob-builder 0.5.1 on 2026-10-06T13:29:31Z. Every key is written,
# defaults included. Output paths, --bundle and --dry-run stay on the
# command line.

deployment_slug: "local"
# token-only | token+unix | keys+llng | mixed | max-security
scenario: "max-security"
portal_url: "http://auth.example.com"
# yes: allow an http:// portal and skip TLS verification, here and on the
# targets (verify_ssl = false, ob-enroll/setup -k). Test setups only.
insecure: "yes"

client_id: "pam-access"
# fixed | modifiable (the target admin may override it with --client-id)
client_id_policy: "modifiable"
# none | prompt | embedded
client_secret_mode: "prompt"
server_group: ""
# fixed | modifiable (the target admin may override it with --server-group)
server_group_policy: "modifiable"

# bastion | standalone | backend; several, comma-separated, give one
# artefact each, suffixed with the role
target_role: "bastion,backend"
# backend only: bastion ids allowed to reach it, comma-separated (empty =
# any bastion enrolled in the same server group)
allowed_bastions: null
# yes | no: logind/nproc/at/cron containment (system-wide, see SECURITY.md)
enable_hardening: "no"
# yes | no: auditd rules and their rotation timer
enable_audit_trace: "no"
# yes | no: bastion/standalone only, yes opts out of session recording
disable_session_recorder: "no"

# yes | no | prompt: the installer runs ob-enroll and ob-*-setup
auto_enroll_setup: "yes"
# yes | no: the shell installer removes itself after a successful run
self_delete: "yes"
# yes | no: the Ansible role approves device codes with an LLNG cookie
# asked at each play run
ansible_auto_approve: "yes"
# true | false: pass --enable-service-keys to the setup run (default: on
# when a service account has a public key)
# service_keys: true

apt_url: "https://192.168.122.1:8000"
apt_suite: "trixie"
apt_component: "main"
# repo_keyring: /usr/share/open-bastion-builder/keyrings/open-bastion-linagora.gpg
# GPG key id signing the shell installer (empty = no signature)
sign_with: ""

# SSH-key-only local accounts, see doc/service-accounts.rst
service_accounts:
  - name: "maintainer"
    # Empty: the tests write the path of the key they generated here.
    public_key_file: ""
    sudo_allowed: true
    sudo_nopasswd: true
    home: "/home/maintainer"
    uid: 1000
    gid: 1000
