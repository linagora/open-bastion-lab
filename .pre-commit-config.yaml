# uv run pre-commit install
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--skip, ".venv,uv.lock,*.json"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-collect
        name: pytest collects the tests
        entry: uv run pytest --collect-only -q
        language: system
        pass_filenames: false
