# Hooks run through uv: they use the environment and the versions uv.lock
# pins, and write nothing of their own. Install them once with
#   uv run pre-commit install
#
# The suite itself needs a free lab, the portal and the package server: it runs
# by hand, and this file does not try.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Cheap: it fails on a module that cannot be imported, or a scenario
      # naming what its feature does not hold. Steps are matched when a
      # scenario runs, so a missing step, or one declared with another
      # keyword than the feature writes, is not seen here.
      - id: pytest-collect
        name: pytest collects the tests
        entry: uv run pytest --collect-only -q
        language: system
        pass_filenames: false
